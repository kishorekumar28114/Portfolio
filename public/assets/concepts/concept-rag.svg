<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <rect width="1000" height="650" fill="#F7F6F1"/>
  <rect x="30" y="30" width="940" height="590" fill="none" stroke="#E3E1D9" stroke-width="1.5"/>
  
  <text x="70" y="80" font-family="'Courier New', monospace" font-size="12" fill="#B7AD62" letter-spacing="2">STAGE 04 — LLMs &amp; RETRIEVAL AUGMENTED GENERATION</text>
  <text x="70" y="115" font-family="Georgia, serif" font-size="28" fill="#242522" font-weight="bold">Embeddings, ChromaDB &amp; Semantic Job Matching</text>
  <text x="70" y="140" font-family="Arial, sans-serif" font-size="14" fill="#85857D">Transformers · Tokenization · Chunking · Cosine Similarity · Conversational RAG in TalentIQ</text>

  <!-- Flow pipeline: 4 stages -->
  <g transform="translate(70, 180)">
    <!-- Stage 1: Document/Resume Chunker -->
    <rect x="0" y="0" width="190" height="380" fill="#FFFFFF" stroke="#E3E1D9" rx="4"/>
    <rect x="0" y="0" width="190" height="6" fill="#85857D" rx="2"/>
    <text x="20" y="35" font-family="'Courier New', monospace" font-size="11" fill="#7E7638" font-weight="bold">01 · INPUT CHUNKING</text>
    <text x="20" y="65" font-family="Georgia, serif" font-size="16" fill="#242522">Raw Résumés &amp;<br/>Job Descriptions</text>
    
    <rect x="20" y="110" width="150" height="35" fill="#F4F1E8" rx="2"/>
    <text x="30" y="132" font-family="'Courier New', monospace" font-size="9" fill="#242522">Chunk #1 [0-512 tok]</text>
    <rect x="20" y="155" width="150" height="35" fill="#F4F1E8" rx="2"/>
    <text x="30" y="177" font-family="'Courier New', monospace" font-size="9" fill="#242522">Chunk #2 [overlap 64]</text>
    <rect x="20" y="200" width="150" height="35" fill="#F4F1E8" rx="2"/>
    <text x="30" y="222" font-family="'Courier New', monospace" font-size="9" fill="#242522">Chunk #3 [Skills list]</text>

    <text x="20" y="280" font-family="Arial, sans-serif" font-size="11" fill="#85857D">Tokenization via BPE, removing noise and preserving semantic boundaries.</text>
  </g>

  <!-- Arrow -->
  <path d="M 270 360 L 295 360" stroke="#B7AD62" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Stage 2: Dense Embeddings -->
  <g transform="translate(300, 180)">
    <rect x="0" y="0" width="190" height="380" fill="#242522" rx="4"/>
    <rect x="0" y="0" width="190" height="6" fill="#B7AD62" rx="2"/>
    <text x="20" y="35" font-family="'Courier New', monospace" font-size="11" fill="#B7AD62" font-weight="bold">02 · VECTORIZATION</text>
    <text x="20" y="65" font-family="Georgia, serif" font-size="16" fill="#FFFFFF">Transformer<br/>Embedding Model</text>
    
    <rect x="20" y="110" width="150" height="120" fill="#1C1D1A" rx="2"/>
    <text x="30" y="135" font-family="'Courier New', monospace" font-size="10" fill="#B7AD62">[ 0.0842, -0.419,</text>
    <text x="30" y="155" font-family="'Courier New', monospace" font-size="10" fill="#B7AD62">  0.2217,  0.891,</text>
    <text x="30" y="175" font-family="'Courier New', monospace" font-size="10" fill="#B7AD62"> -0.1104,  0.038,</text>
    <text x="30" y="195" font-family="'Courier New', monospace" font-size="10" fill="#B7AD62">  ... 768 dims ]</text>

    <text x="20" y="280" font-family="Arial, sans-serif" font-size="11" fill="#E3E1D9">Dense semantic vectors capturing latent skill relationships.</text>
  </g>

  <!-- Arrow -->
  <path d="M 500 360 L 525 360" stroke="#B7AD62" stroke-width="3"/>

  <!-- Stage 3: ChromaDB Vector Store & Cosine Similarity -->
  <g transform="translate(530, 180)">
    <rect x="0" y="0" width="190" height="380" fill="#FFFFFF" stroke="#E3E1D9" rx="4"/>
    <rect x="0" y="0" width="190" height="6" fill="#7E7638" rx="2"/>
    <text x="20" y="35" font-family="'Courier New', monospace" font-size="11" fill="#7E7638" font-weight="bold">03 · CHROMADB INDEX</text>
    <text x="20" y="65" font-family="Georgia, serif" font-size="16" fill="#242522">Approx Nearest<br/>Neighbors (HNSW)</text>
    
    <circle cx="95" cy="170" r="50" fill="none" stroke="#B7AD62" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="95" cy="170" r="8" fill="#242522"/>
    <circle cx="80" cy="150" r="6" fill="#B7AD62"/>
    <circle cx="115" cy="155" r="6" fill="#B7AD62"/>
    <circle cx="120" cy="190" r="5" fill="#85857D"/>
    
    <text x="20" y="280" font-family="'Courier New', monospace" font-size="11" fill="#7E7638" font-weight="bold">COSINE SIM ≥ 0.82</text>
    <text x="20" y="305" font-family="Arial, sans-serif" font-size="11" fill="#85857D">Top-k candidate company &amp; role matching retrieval.</text>
  </g>

  <!-- Arrow -->
  <path d="M 730 360 L 755 360" stroke="#B7AD62" stroke-width="3"/>

  <!-- Stage 4: Synthesized Response / LangGraph Chat -->
  <g transform="translate(760, 180)">
    <rect x="0" y="0" width="170" height="380" fill="#242522" rx="4"/>
    <rect x="0" y="0" width="170" height="6" fill="#B7AD62" rx="2"/>
    <text x="18" y="35" font-family="'Courier New', monospace" font-size="11" fill="#B7AD62" font-weight="bold">04 · RAG ANSWER</text>
    <text x="18" y="65" font-family="Georgia, serif" font-size="16" fill="#FFFFFF">Conversational<br/>Advisor</text>
    
    <rect x="18" y="110" width="134" height="130" fill="#1C1D1A" rx="2"/>
    <text x="26" y="132" font-family="Arial, sans-serif" font-size="10" fill="#B7AD62">"Based on your C++ and ML projects, Top Match: Deep Learning Systems role at XYZ..."</text>
    
    <text x="18" y="280" font-family="Arial, sans-serif" font-size="11" fill="#E3E1D9">Augmented context delivered to user without hallucination.</text>
  </g>
</svg>