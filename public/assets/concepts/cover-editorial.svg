<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9F8F5"/>
      <stop offset="100%" stop-color="#ECE8DC"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E3E1D9" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#grid)" opacity="0.6"/>
  
  <!-- Architectural Paper Composition -->
  <g transform="translate(140, 100)">
    <!-- Base Plate -->
    <rect x="0" y="0" width="920" height="600" fill="#242522" rx="4" filter="drop-shadow(0 25px 40px rgba(36,37,34,0.18))"/>
    <rect x="18" y="18" width="884" height="564" fill="none" stroke="#F7F6F1" stroke-width="1" opacity="0.2"/>
    
    <!-- Editorial Plate Left -->
    <rect x="60" y="60" width="380" height="480" fill="#2A2C28" rx="2"/>
    <line x1="60" y1="120" x2="440" y2="120" stroke="#B7AD62" stroke-width="2"/>
    <text x="80" y="95" font-family="'Courier New', monospace" font-size="12" fill="#B7AD62" letter-spacing="3">PORTFOLIO / VOL. 2026</text>
    <text x="80" y="190" font-family="Georgia, serif" font-size="44" fill="#F7F6F1" font-weight="bold">KISHORE</text>
    <text x="80" y="240" font-family="Georgia, serif" font-size="44" fill="#F7F6F1" font-style="italic" font-weight="300">KUMAR G</text>
    <rect x="80" y="270" width="60" height="4" fill="#B7AD62"/>
    
    <text x="80" y="320" font-family="'Courier New', monospace" font-size="11" fill="#85857D" letter-spacing="1.5">SPECIALISATION</text>
    <text x="80" y="345" font-family="Arial, sans-serif" font-size="14" fill="#E3E1D9">Full-Stack Development</text>
    <text x="80" y="365" font-family="Arial, sans-serif" font-size="14" fill="#E3E1D9">Machine Learning & RAG</text>
    <text x="80" y="385" font-family="Arial, sans-serif" font-size="14" fill="#B7AD62">Agentic AI Exploration</text>

    <text x="80" y="470" font-family="'Courier New', monospace" font-size="10" fill="#85857D" letter-spacing="2">EDITION 01 · SRI ESHWAR / CSBS</text>

    <!-- Graphic Elements Right -->
    <g transform="translate(480, 60)">
      <!-- Warm paper overlay card -->
      <rect x="20" y="20" width="360" height="440" fill="#F7F6F1" rx="2" filter="drop-shadow(0 15px 30px rgba(0,0,0,0.3))"/>
      <rect x="35" y="35" width="330" height="410" fill="none" stroke="#E3E1D9" stroke-width="1"/>
      
      <!-- Golden ratio & geometric art circles -->
      <circle cx="200" cy="180" r="110" fill="none" stroke="#B7AD62" stroke-width="1.5" stroke-dasharray="4 4"/>
      <circle cx="200" cy="180" r="75" fill="#F4F1E8" stroke="#242522" stroke-width="1.2"/>
      <circle cx="200" cy="180" r="35" fill="#B7AD62" opacity="0.25"/>
      <circle cx="200" cy="180" r="8" fill="#B7AD62"/>

      <!-- Crosshairs and Coordinates -->
      <line x1="60" y1="180" x2="340" y2="180" stroke="#85857D" stroke-width="0.8" opacity="0.4"/>
      <line x1="200" y1="50" x2="200" y2="310" stroke="#85857D" stroke-width="0.8" opacity="0.4"/>
      
      <!-- Editorial Data block -->
      <rect x="50" y="330" width="300" height="85" fill="#ECE8DC" rx="2"/>
      <text x="70" y="355" font-family="'Courier New', monospace" font-size="10" fill="#242522" font-weight="bold">SYSTEM INDEX</text>
      <text x="70" y="375" font-family="'Courier New', monospace" font-size="11" fill="#85857D">01 CODE → 02 STACK → 03 DATA</text>
      <text x="70" y="395" font-family="'Courier New', monospace" font-size="11" fill="#7E7638" font-weight="bold">04 RAG & RECS → 05 AGENTS</text>
    </g>
  </g>
</svg>