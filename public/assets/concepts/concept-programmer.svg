<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <rect width="1000" height="650" fill="#F7F6F1"/>
  <rect x="30" y="30" width="940" height="590" fill="none" stroke="#E3E1D9" stroke-width="1.5"/>
  
  <!-- Header -->
  <text x="70" y="80" font-family="'Courier New', monospace" font-size="12" fill="#B7AD62" letter-spacing="2">STAGE 01 — THE PROGRAMMER</text>
  <text x="70" y="115" font-family="Georgia, serif" font-size="28" fill="#242522" font-weight="bold">Algorithmic Foundations &amp; Problem Solving</text>
  <text x="70" y="140" font-family="Arial, sans-serif" font-size="14" fill="#85857D">540+ LeetCode problems solved · C++, Python, Java &amp; SQL daily discipline</text>

  <!-- Left: Binary Tree & Graph Flow -->
  <g transform="translate(70, 180)">
    <rect width="400" height="390" fill="#FFFFFF" stroke="#E3E1D9" rx="4"/>
    <text x="25" y="40" font-family="'Courier New', monospace" font-size="11" fill="#85857D">DATA STRUCTURES &amp; ALGORITHMS</text>
    
    <!-- Tree Nodes -->
    <!-- Root -->
    <circle cx="200" cy="90" r="22" fill="#242522"/>
    <text x="200" y="95" font-family="'Courier New', monospace" font-size="12" fill="#FFFFFF" text-anchor="middle">Root</text>
    
    <!-- Level 1 -->
    <line x1="185" y1="108" x2="115" y2="152" stroke="#B7AD62" stroke-width="2"/>
    <line x1="215" y1="108" x2="285" y2="152" stroke="#B7AD62" stroke-width="2"/>
    <circle cx="105" cy="170" r="20" fill="#F4F1E8" stroke="#242522" stroke-width="2"/>
    <text x="105" y="175" font-family="'Courier New', monospace" font-size="11" fill="#242522" text-anchor="middle">L</text>
    <circle cx="295" cy="170" r="20" fill="#B7AD62"/>
    <text x="295" y="175" font-family="'Courier New', monospace" font-size="11" fill="#242522" text-anchor="middle" font-weight="bold">R</text>

    <!-- Level 2 -->
    <line x1="95" y1="188" x2="60" y2="232" stroke="#B7AD62" stroke-width="1.5"/>
    <line x1="115" y1="188" x2="150" y2="232" stroke="#B7AD62" stroke-width="1.5"/>
    <circle cx="50" cy="250" r="17" fill="#F4F1E8" stroke="#85857D"/>
    <text x="50" y="254" font-family="'Courier New', monospace" font-size="10" fill="#242522" text-anchor="middle">L1</text>
    <circle cx="160" cy="250" r="17" fill="#F4F1E8" stroke="#85857D"/>
    <text x="160" y="254" font-family="'Courier New', monospace" font-size="10" fill="#242522" text-anchor="middle">L2</text>

    <line x1="285" y1="188" x2="245" y2="232" stroke="#B7AD62" stroke-width="1.5"/>
    <line x1="305" y1="188" x2="345" y2="232" stroke="#B7AD62" stroke-width="1.5"/>
    <circle cx="235" cy="250" r="17" fill="#242522"/>
    <text x="235" y="254" font-family="'Courier New', monospace" font-size="10" fill="#FFFFFF" text-anchor="middle">R1</text>
    <circle cx="355" cy="250" r="17" fill="#F4F1E8" stroke="#85857D"/>
    <text x="355" y="254" font-family="'Courier New', monospace" font-size="10" fill="#242522" text-anchor="middle">R2</text>

    <!-- Path highlight -->
    <path d="M 200 90 L 295 170 L 235 250" fill="none" stroke="#7E7638" stroke-width="3" stroke-dasharray="3 3"/>

    <!-- Metrics -->
    <rect x="25" y="300" width="350" height="65" fill="#F7F6F1" rx="2"/>
    <text x="45" y="325" font-family="'Courier New', monospace" font-size="11" fill="#7E7638" font-weight="bold">O(V + E) GRAPH SEARCH · O(N LOG N) SORT</text>
    <text x="45" y="348" font-family="'Courier New', monospace" font-size="10" fill="#85857D">Dynamic Programming · Two Pointers · Monotonic Stacks</text>
  </g>

  <!-- Right: Code Architecture & LeetCode Metrics -->
  <g transform="translate(500, 180)">
    <rect width="430" height="390" fill="#242522" rx="4"/>
    <text x="30" y="40" font-family="'Courier New', monospace" font-size="11" fill="#B7AD62" letter-spacing="1">PROBLEM SOLVING MASTERY</text>

    <!-- 540+ Badge -->
    <rect x="30" y="65" width="370" height="90" fill="#2D2F2A" rx="3" stroke="#3A3C36"/>
    <text x="50" y="115" font-family="Georgia, serif" font-size="44" fill="#B7AD62" font-weight="bold">540+</text>
    <text x="180" y="98" font-family="Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold">Problems Solved</text>
    <text x="180" y="118" font-family="Arial, sans-serif" font-size="12" fill="#85857D">LeetCode &amp; SkillRack Leaderboard</text>
    <text x="180" y="136" font-family="'Courier New', monospace" font-size="10" fill="#B7AD62">TOPPER · SEMESTERS 2, 3 &amp; 4</text>

    <!-- Terminal snippet -->
    <rect x="30" y="175" width="370" height="185" fill="#1C1D1A" rx="3"/>
    <text x="45" y="205" font-family="'Courier New', monospace" font-size="11" fill="#85857D">// C++ &amp; Python Competitive Core</text>
    <text x="45" y="230" font-family="'Courier New', monospace" font-size="11" fill="#B7AD62">vector&lt;int&gt;</text>
    <text x="135" y="230" font-family="'Courier New', monospace" font-size="11" fill="#F7F6F1">twoSum(vector&lt;int&gt;&amp; nums, int target) {</text>
    <text x="65" y="255" font-family="'Courier New', monospace" font-size="11" fill="#F7F6F1">unordered_map&lt;int, int&gt; seen;</text>
    <text x="65" y="280" font-family="'Courier New', monospace" font-size="11" fill="#F7F6F1">for (int i = 0; i &lt; nums.size(); ++i) {</text>
    <text x="85" y="305" font-family="'Courier New', monospace" font-size="11" fill="#85857D">int diff = target - nums[i];</text>
    <text x="85" y="330" font-family="'Courier New', monospace" font-size="11" fill="#B7AD62">if (seen.count(diff)) return {seen[diff], i};</text>
    <text x="45" y="348" font-family="'Courier New', monospace" font-size="11" fill="#F7F6F1">}</text>
  </g>
</svg>