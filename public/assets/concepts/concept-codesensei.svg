<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <rect width="1000" height="650" fill="#F7F6F1"/>
  <rect x="30" y="30" width="940" height="590" fill="none" stroke="#E3E1D9" stroke-width="1.5"/>
  
  <text x="70" y="80" font-family="'Courier New', monospace" font-size="12" fill="#B7AD62" letter-spacing="2">PROJECT 03 — CODESENSEI</text>
  <text x="70" y="115" font-family="Georgia, serif" font-size="28" fill="#242522" font-weight="bold">Code Complexity Analyzer &amp; AI Assistant</text>
  <text x="70" y="140" font-family="Arial, sans-serif" font-size="14" fill="#85857D">Static code parsing · Cyclomatic complexity calculation · LLM refactoring suggestions</text>

  <!-- Left: IDE / Code input editor representation -->
  <g transform="translate(70, 170)">
    <rect width="440" height="400" fill="#1E1F1C" rx="4"/>
    <rect width="440" height="30" fill="#282924" rx="4"/>
    <circle cx="20" cy="15" r="4" fill="#FF5F56"/>
    <circle cx="35" cy="15" r="4" fill="#FFBD2E"/>
    <circle cx="50" cy="15" r="4" fill="#27C93F"/>
    <text x="80" y="19" font-family="'Courier New', monospace" font-size="10" fill="#85857D">solution.py — Analysis View</text>

    <!-- Code Lines -->
    <text x="25" y="65" font-family="'Courier New', monospace" font-size="11" fill="#85857D">01</text>
    <text x="55" y="65" font-family="'Courier New', monospace" font-size="11" fill="#B7AD62">def</text>
    <text x="85" y="65" font-family="'Courier New', monospace" font-size="11" fill="#F7F6F1">find_subsets(nums: list) -&gt; list:</text>
    
    <text x="25" y="95" font-family="'Courier New', monospace" font-size="11" fill="#85857D">02</text>
    <text x="70" y="95" font-family="'Courier New', monospace" font-size="11" fill="#F7F6F1">res = []</text>
    
    <text x="25" y="125" font-family="'Courier New', monospace" font-size="11" fill="#85857D">03</text>
    <text x="70" y="125" font-family="'Courier New', monospace" font-size="11" fill="#B7AD62">def</text>
    <text x="100" y="125" font-family="'Courier New', monospace" font-size="11" fill="#F7F6F1">backtrack(start, path):</text>

    <text x="25" y="155" font-family="'Courier New', monospace" font-size="11" fill="#85857D">04</text>
    <text x="90" y="155" font-family="'Courier New', monospace" font-size="11" fill="#F7F6F1">res.append(list(path))</text>

    <text x="25" y="185" font-family="'Courier New', monospace" font-size="11" fill="#85857D">05</text>
    <text x="90" y="185" font-family="'Courier New', monospace" font-size="11" fill="#B7AD62">for</text>
    <text x="120" y="185" font-family="'Courier New', monospace" font-size="11" fill="#F7F6F1">i in range(start, len(nums)):</text>

    <!-- Highlighted box -->
    <rect x="50" y="200" width="360" height="60" fill="#2E3028" stroke="#B7AD62" stroke-width="1" rx="2"/>
    <text x="70" y="225" font-family="'Courier New', monospace" font-size="10" fill="#B7AD62">// BRANCHING FACTOR 2^N</text>
    <text x="70" y="245" font-family="'Courier New', monospace" font-size="10" fill="#F7F6F1">backtrack(i + 1, path + [nums[i]])</text>

    <text x="25" y="300" font-family="'Courier New', monospace" font-size="10" fill="#85857D">Parsed AST nodes: 42 · Cyclomatic metric: 4</text>
  </g>

  <!-- Right: Metrics and AI Feedback -->
  <g transform="translate(540, 170)">
    <rect width="390" height="400" fill="#FFFFFF" stroke="#E3E1D9" rx="4"/>
    <text x="30" y="40" font-family="'Courier New', monospace" font-size="11" fill="#7E7638" font-weight="bold">AI COMPLEXITY REPORT</text>

    <!-- Big Complexity Meter -->
    <rect x="30" y="65" width="330" height="90" fill="#F4F1E8" rx="3"/>
    <text x="50" y="105" font-family="Georgia, serif" font-size="34" fill="#242522" font-weight="bold">O(2ⁿ)</text>
    <text x="160" y="95" font-family="'Courier New', monospace" font-size="10" fill="#7E7638" font-weight="bold">TIME COMPLEXITY</text>
    <text x="160" y="115" font-family="'Courier New', monospace" font-size="10" fill="#85857D">Space: O(N) auxiliary callstack</text>

    <text x="30" y="190" font-family="'Courier New', monospace" font-size="10" fill="#85857D">INTELLIGENT SUGGESTIONS</text>

    <rect x="30" y="205" width="330" height="65" fill="#F9F8F5" stroke="#E3E1D9" rx="2"/>
    <text x="45" y="228" font-family="Arial, sans-serif" font-size="12" fill="#242522" font-weight="bold">Iterative Bitmasking Alternative</text>
    <text x="45" y="250" font-family="Arial, sans-serif" font-size="11" fill="#85857D">Reduces recursive stack overhead from O(N) to O(1).</text>

    <rect x="30" y="285" width="330" height="65" fill="#F9F8F5" stroke="#E3E1D9" rx="2"/>
    <text x="45" y="308" font-family="Arial, sans-serif" font-size="12" fill="#242522" font-weight="bold">Explain Complexity in Plain English</text>
    <text x="45" y="330" font-family="Arial, sans-serif" font-size="11" fill="#85857D">Provides clear breakdown suitable for interview preparation.</text>
  </g>
</svg>