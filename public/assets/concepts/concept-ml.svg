<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <rect width="1000" height="650" fill="#F7F6F1"/>
  <rect x="30" y="30" width="940" height="590" fill="none" stroke="#E3E1D9" stroke-width="1.5"/>
  
  <text x="70" y="80" font-family="'Courier New', monospace" font-size="12" fill="#B7AD62" letter-spacing="2">STAGE 03 · MACHINE LEARNING</text>
  <text x="70" y="115" font-family="Georgia, serif" font-size="28" fill="#242522" font-weight="bold">Student Performance Analyzer</text>
  <text x="70" y="140" font-family="Arial, sans-serif" font-size="14" fill="#85857D">Study habits, past scores &amp; attendance → Grade prediction via Random Forest Regression</text>

  <!-- Left: Regression curve with confidence bands -->
  <g transform="translate(70, 170)">
    <rect width="520" height="400" fill="#FFFFFF" stroke="#E3E1D9" rx="4"/>
    <text x="30" y="40" font-family="'Courier New', monospace" font-size="11" fill="#7E7638" font-weight="bold">STUDY HOURS VS PREDICTED FINAL SCORE</text>
    
    <!-- Axes -->
    <line x1="60" y1="340" x2="470" y2="340" stroke="#242522" stroke-width="1.5"/>
    <line x1="60" y1="340" x2="60" y2="80" stroke="#242522" stroke-width="1.5"/>
    <text x="240" y="370" font-family="'Courier New', monospace" font-size="10" fill="#85857D">DAILY STUDY HOURS →</text>
    <text x="30" y="70" font-family="'Courier New', monospace" font-size="10" fill="#85857D">GRADE % ↑</text>

    <!-- Regression line & area -->
    <path d="M 60 310 L 150 270 L 260 210 L 380 140 L 460 90" fill="none" stroke="#242522" stroke-width="2.5"/>
    <path d="M 60 290 L 150 250 L 260 190 L 380 120 L 460 75" fill="none" stroke="#B7AD62" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M 60 330 L 150 290 L 260 230 L 380 160 L 460 105" fill="none" stroke="#B7AD62" stroke-width="1" stroke-dasharray="3 3"/>

    <!-- Sample test plots -->
    <circle cx="110" cy="285" r="5" fill="#85857D"/>
    <circle cx="190" cy="245" r="6" fill="#B7AD62"/>
    <circle cx="280" cy="205" r="6" fill="#7E7638"/>
    <circle cx="360" cy="148" r="6" fill="#242522"/>
    <circle cx="430" cy="100" r="7" fill="#B7AD62"/>

    <!-- Callout -->
    <rect x="230" y="90" width="160" height="40" fill="#F4F1E8" rx="2" stroke="#E3E1D9"/>
    <text x="245" y="107" font-family="'Courier New', monospace" font-size="10" fill="#242522" font-weight="bold">R² SCORE: 0.88</text>
    <text x="245" y="122" font-family="'Courier New', monospace" font-size="9" fill="#85857D">LOWEST RESIDUAL VARIANCE</text>
  </g>

  <!-- Right: Decision tree splits -->
  <g transform="translate(620, 170)">
    <rect width="310" height="400" fill="#242522" rx="4"/>
    <text x="25" y="40" font-family="'Courier New', monospace" font-size="11" fill="#B7AD62" letter-spacing="1">REGRESSOR TREE SPLIT</text>

    <!-- Node 1 -->
    <rect x="60" y="70" width="190" height="40" fill="#2E302A" stroke="#B7AD62" rx="3"/>
    <text x="155" y="94" font-family="'Courier New', monospace" font-size="10" fill="#FFFFFF" text-anchor="middle">Study Time &gt; 4.5 hrs/day?</text>

    <!-- Split Lines -->
    <line x1="110" y1="110" x2="80" y2="150" stroke="#85857D" stroke-width="1.5"/>
    <line x1="200" y1="110" x2="230" y2="150" stroke="#B7AD62" stroke-width="1.5"/>

    <!-- Left Child -->
    <rect x="25" y="150" width="120" height="45" fill="#1C1D1A" rx="2"/>
    <text x="85" y="170" font-family="'Courier New', monospace" font-size="9" fill="#85857D" text-anchor="middle">Past GPA &lt; 7.0</text>
    <text x="85" y="186" font-family="'Courier New', monospace" font-size="9" fill="#B7AD62" text-anchor="middle">Grade: 62% ± 4</text>

    <!-- Right Child -->
    <rect x="170" y="150" width="120" height="45" fill="#2E302A" rx="2" stroke="#7E7638"/>
    <text x="230" y="170" font-family="'Courier New', monospace" font-size="9" fill="#FFFFFF" text-anchor="middle">Past GPA ≥ 7.0</text>
    <text x="230" y="186" font-family="'Courier New', monospace" font-size="9" fill="#B7AD62" text-anchor="middle">Grade: 88% ± 3</text>

    <rect x="25" y="240" width="260" height="120" fill="#1C1D1A" rx="2"/>
    <text x="40" y="270" font-family="'Courier New', monospace" font-size="10" fill="#B7AD62">INPUT VARIABLES</text>
    <text x="40" y="295" font-family="Arial, sans-serif" font-size="12" fill="#E3E1D9">• Daily study duration (hours)</text>
    <text x="40" y="318" font-family="Arial, sans-serif" font-size="12" fill="#E3E1D9">• Attendance percentage</text>
    <text x="40" y="340" font-family="Arial, sans-serif" font-size="12" fill="#E3E1D9">• Formative assessment scores</text>
  </g>
</svg>